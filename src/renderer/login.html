<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تسجيل الدخول</title>
  <link rel="stylesheet" href="styles/app.css" />
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="login-title">النظام الرئيسي لإدارة المبيعات والمخازن</div>
    <div class="login-card">
      <div class="login-logo" id="logo"></div>
      <div>
        <div class="login-fields">
          <div class="login-field">
            <label for="username">اسم المستخدم</label>
            <div class="with-icon">
              <input id="username" type="text" autocomplete="username" />
              <span class="ficon" id="userIcon"></span>
            </div>
          </div>
          <div class="login-field">
            <label for="password">كلمة المرور</label>
            <div class="with-icon">
              <input id="password" type="password" autocomplete="current-password" />
              <span class="ficon" id="lockIcon"></span>
            </div>
          </div>
        </div>
        <div class="login-error" id="err"></div>
        <div class="login-actions">
          <button class="btn" id="loginBtn">دخول</button>
          <button class="btn gold" id="changeBtn">تغيير كلمة المرور</button>
        </div>
      </div>
    </div>
  </div>
  <script src="js/api-fallback.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
